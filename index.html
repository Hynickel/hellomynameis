<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e3b2c">
<title>مين هو؟</title>
<style>
:root{
  --bg:#101820;
  --bg2:#1c2b35;
  --ink:#f3f5f4;
  --mut:#9eafb5;
  --card:#f4f2ec;
  --cardink:#17252b;
  --gold:#e8b85b;
  --red:#d96c62;
  --ok:#9bc9a9;
  --line:rgba(255,255,255,.09);
  --panel:rgba(255,255,255,.045);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif}
body{
  position:relative;
  isolation:isolate;
  padding:32px 22px max(32px,env(safe-area-inset-bottom));
  max-width:900px;
  margin:0 auto;
}
body:before{
  content:"";
  position:fixed;
  z-index:-1;
  width:520px;height:520px;
  top:-300px;right:-180px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(232,184,91,.13),transparent 68%);
  pointer-events:none;
}
body:after{
  content:"";
  position:fixed;
  z-index:-1;
  width:480px;height:480px;
  bottom:-300px;left:-220px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(83,142,151,.13),transparent 68%);
  pointer-events:none;
}
#app{
  width:100%;
  min-height:460px;
  padding:clamp(22px,4vw,42px);
  border:1px solid var(--line);
  border-radius:28px;
  background:linear-gradient(145deg,rgba(31,48,58,.97),rgba(21,33,42,.97));
  box-shadow:0 24px 70px rgba(0,0,0,.28);
}
h1{
  font-size:clamp(30px,5vw,42px);
  line-height:1.25;
  margin:0 0 8px;
  font-weight:850;
  letter-spacing:-.7px;
}
h1:after{
  content:"";
  display:block;
  width:48px;height:4px;
  margin-top:13px;
  border-radius:10px;
  background:var(--gold);
}
h2{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:16px;
  margin:30px 0 12px;
  color:var(--gold);
  font-weight:750;
}
h2:before{
  content:"";
  width:5px;height:18px;
  border-radius:8px;
  background:var(--gold);
}
p.sub{color:var(--mut);margin:0 0 10px;line-height:1.75;font-size:14px}
input,select{
  width:100%;
  min-width:0;
  padding:13px 15px;
  border-radius:13px;
  border:1px solid rgba(255,255,255,.10);
  background:#14232c;
  color:var(--ink);
  font-size:15px;
  font-family:inherit;
  transition:border-color .18s,background .18s;
}
input::placeholder{color:#84969d}
input:focus,select:focus{outline:none;border-color:var(--gold);background:#192b35}
button{
  font-family:inherit;
  font-size:15px;
  font-weight:750;
  border:1px solid transparent;
  border-radius:13px;
  padding:13px 18px;
  cursor:pointer;
  color:#202a2d;
  background:var(--gold);
  transition:transform .16s,filter .16s,border-color .16s,background .16s;
}
button:hover{filter:brightness(1.06);transform:translateY(-1px)}
button:active{transform:scale(.98)}
button:disabled{cursor:not-allowed;filter:saturate(.3)}
button.ghost{
  background:#253944;
  color:var(--ink);
  border-color:rgba(255,255,255,.07);
}
button.big{width:100%;margin-top:16px;padding:16px;font-size:16px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #fff;outline-offset:3px}
.row{display:flex;gap:10px;align-items:stretch}
.row>*{flex:1;min-width:0}
.row>button{flex:0 0 auto}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;min-height:30px}
.chip{
  background:#263b45;
  border:1px solid rgba(255,255,255,.06);
  border-radius:999px;
  padding:7px 9px 7px 13px;
  display:flex;align-items:center;gap:8px;
  color:#e8eeee;font-size:14px;
}
.chip b{
  background:none;color:#f08a7d;padding:0 5px;
  font-size:20px;line-height:1;cursor:pointer;
}
.team-boards{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:12px;
}
.team-col{
  background:var(--panel);
  border:1.5px solid var(--line);
  border-radius:16px;
  padding:12px;
  min-height:160px;
  transition:border-color .2s,background .2s;
}
.team-col.drag-over{
  border-color:var(--gold);
  background:rgba(232,184,91,.08);
}
.team-col .team-title{
  display:flex;align-items:center;gap:8px;margin-bottom:10px;
}
.team-col .team-title input{
  flex:1;padding:8px 10px;font-size:14px;font-weight:700;
  border-radius:10px;text-align:center;
}
.team-col .team-count{
  font-size:11px;color:var(--mut);white-space:nowrap;
}
.team-drop{
  min-height:90px;
  display:flex;flex-direction:column;gap:8px;
}
.team-player{
  background:#263b45;
  border:1px solid rgba(255,255,255,.08);
  border-radius:12px;
  padding:10px 12px;
  font-size:14px;font-weight:650;
  cursor:grab;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  transition:transform .12s,background .15s,box-shadow .15s;
  user-select:none;-webkit-user-select:none;
  touch-action:none;
}
.team-player:active{cursor:grabbing}
.team-player.dragging{opacity:.45;transform:scale(.96)}
.team-player .move-btn{
  background:rgba(255,255,255,.08);
  border:none;color:var(--mut);
  width:28px;height:28px;border-radius:8px;
  font-size:14px;padding:0;cursor:pointer;
  flex-shrink:0;
}
.team-player .move-btn:hover{background:rgba(232,184,91,.2);color:var(--gold)}
.team-empty{
  color:var(--mut);font-size:13px;text-align:center;
  padding:20px 8px;border:1px dashed rgba(255,255,255,.12);
  border-radius:12px;
}
@media(max-width:500px){
  .team-boards{grid-template-columns:1fr;gap:10px}
}
.cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cats button{
  min-height:54px;
  background:#20343e;
  color:#dce5e5;
  border:1px solid rgba(255,255,255,.07);
}
.cats button.on{
  border-color:var(--gold);
  background:rgba(232,184,91,.11);
  color:#f2cc83;
  box-shadow:inset 0 0 0 1px rgba(232,184,91,.12);
}
.top{
  display:flex;justify-content:space-between;align-items:center;
  margin:0 0 14px;color:var(--mut);font-size:14px;gap:12px;
  padding-bottom:14px;border-bottom:1px solid var(--line);
}
.top-right{display:flex;align-items:center;gap:10px}
.exit-btn{
  background:rgba(217,108,98,.14);
  color:#ffaaa1;border:1px solid rgba(217,108,98,.25);
  padding:9px 13px;font-size:13px;border-radius:11px;
}
.confirm-backdrop{
  position:fixed;inset:0;background:rgba(4,10,14,.78);
  backdrop-filter:blur(7px);display:grid;place-items:center;
  padding:20px;z-index:99;
}
.confirm-box{
  width:min(100%,390px);background:var(--card);color:var(--cardink);
  border-radius:22px;padding:25px;text-align:center;
  box-shadow:0 20px 70px #0009;
}
.confirm-box h2{display:block;margin:0 0 10px;color:#a84b43}
.confirm-box h2:before{display:none}
.confirm-box p{line-height:1.8;color:#4d5b5b}
.confirm-actions{display:flex;gap:9px;margin-top:18px}
.confirm-actions button{flex:1}
.confirm-actions .stay{background:#dce5df;color:#17252b}
.timer{
  font-size:21px;font-weight:850;color:var(--gold);
  min-width:54px;text-align:center;font-variant-numeric:tabular-nums;
  background:rgba(232,184,91,.12);border:1px solid rgba(232,184,91,.2);
  border-radius:12px;padding:7px 10px;
}
.timer.low{color:#ff8b80;background:rgba(217,108,98,.14)}
.pts{text-align:center;margin:18px 0 10px;color:var(--mut);line-height:1.7}
.pts span{
  display:inline-block;background:var(--gold);color:#202a2d;
  font-weight:850;border-radius:10px;padding:3px 14px;
  font-size:21px;margin:0 6px;
}
.clue{
  background:var(--card);color:var(--cardink);
  border-radius:17px;padding:18px 20px;margin:12px 0;
  font-size:18px;line-height:1.8;
  border:1px solid rgba(255,255,255,.3);
  border-right:5px solid var(--gold);
  box-shadow:0 8px 22px rgba(0,0,0,.12);
  animation:pop .22s ease-out;
}
.clue small{display:block;color:#71817b;font-size:12px;font-weight:700;margin-bottom:5px}
.locked{
  border:1px dashed rgba(255,255,255,.2);
  border-radius:13px;padding:12px;margin:12px 0;
  color:var(--mut);text-align:center;background:rgba(255,255,255,.025);
  font-size:14px;
}
@keyframes pop{from{transform:translateY(5px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.answer{
  font-size:clamp(30px,6vw,42px);font-weight:850;text-align:center;
  color:var(--gold);margin:24px 0 10px;
}
.who{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.who button{
  min-height:54px;background:rgba(155,201,169,.16);
  color:#c6e8ce;border:1px solid rgba(155,201,169,.3);
}
.who button:hover{background:rgba(155,201,169,.24)}
.score{
  display:flex;justify-content:space-between;align-items:center;
  gap:14px;padding:15px 18px;
  background:#223741;border:1px solid var(--line);
  border-radius:14px;margin:10px 0;font-size:16px;
}
.score.first{background:rgba(232,184,91,.16);border-color:rgba(232,184,91,.45);color:#f5d18e;font-weight:850}
.mini{
  display:flex;gap:8px;overflow-x:auto;margin-top:12px;
  padding:4px 2px 14px;border-bottom:1px solid var(--line);
  scrollbar-width:thin;
}
.mini div{
  background:#253b45;border:1px solid var(--line);
  border-radius:10px;padding:7px 11px;white-space:nowrap;
  font-size:13px;color:var(--ink);
}
.mini span{font-size:13px;color:var(--gold);align-self:center;font-weight:bold;white-space:nowrap}
.foot{height:18px}
.steps{display:flex;gap:8px;margin:4px 0 6px}
.steps span{flex:1;text-align:center;padding:9px 6px;border-radius:11px;font-size:13px;font-weight:750;color:var(--mut);background:rgba(255,255,255,.04);border:1px solid var(--line)}
.steps span.on{color:#f2cc83;background:rgba(232,184,91,.12);border-color:rgba(232,184,91,.35)}
.seg{display:flex;gap:8px;flex:1}
.seg button{flex:1;background:#20343e;color:#dce5e5;border:1px solid rgba(255,255,255,.07);padding:11px 6px;font-size:14px}
.seg button.on{border-color:var(--gold);background:rgba(232,184,91,.11);color:#f2cc83}
.opt{margin:14px 0}
.opt .lbl{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px;font-size:15px;font-weight:700}
.opt .lbl small{color:var(--mut);font-weight:500;font-size:12px}
.cats button small{display:block;font-size:11px;font-weight:500;opacity:.7;margin-top:2px}
details.more{margin-top:20px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px 14px}
details.more summary{cursor:pointer;padding:12px 0;font-size:14px;font-weight:700;color:var(--mut)}
details.more[open] summary{color:var(--gold)}
details.more .row{margin:8px 0 12px}
.nav{display:flex;gap:10px;margin-top:18px}
.nav button{margin:0}
.nav .ghost{flex:0 0 auto;padding-inline:20px}
.nav .go{flex:1;padding:16px;font-size:16px}
.skip-btn{background:rgba(155,201,169,.14);color:#c6e8ce;border:1px solid rgba(155,201,169,.3);margin-top:10px}
.skip-panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
.skip-panel p{margin:0 0 10px;color:var(--mut);font-size:14px;line-height:1.7}
.skip-panel .who button{background:rgba(232,184,91,.13);color:#f2cc83;border-color:rgba(232,184,91,.3)}
.skip-panel .who button:disabled{opacity:.35}
.sk{font-size:12px;color:#c6e8ce;margin-inline-start:4px}
.act-row{display:flex;gap:10px;margin-top:10px}
.act-row button{flex:1;margin:0}
.dbl-btn{background:rgba(232,184,91,.13);color:#f2cc83;border:1px solid rgba(232,184,91,.3)}
.dbl-note{text-align:center;margin:6px 0 0;color:#f2cc83;font-size:14px;line-height:1.7}
.chip small{color:var(--gold);font-size:12px;white-space:nowrap}
.st{display:block;font-size:12px;color:var(--mut);font-weight:600;margin-top:3px}
.score.first .st{color:#f5d18e}
.win-box h2{color:#8a5d10}
.win-trophy{font-size:68px;line-height:1.1;animation:pop .5s ease-out}
.win-name{font-size:26px;font-weight:850;margin:8px 0 4px;line-height:1.5}
.win-meta{color:#4d5b5b;font-size:15px;line-height:1.8;margin:0}
/* —— تحسينات UX —— */
.seg{flex-wrap:wrap}
.seg button{
  min-width:52px;
  border-radius:12px;
  transition:background .15s,border-color .15s,color .15s,transform .12s;
}
.seg button:active{transform:scale(.96)}
.cats button{transition:background .15s,border-color .15s,color .15s,transform .12s}
.cats button:active{transform:scale(.97)}
.scoreboard{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(100px,1fr));
  gap:8px;
  margin:4px 0 16px;
}
.score-card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
  padding:12px 10px;
  text-align:center;
  transition:border-color .2s,background .2s;
}
.score-card.lead{
  background:rgba(232,184,91,.14);
  border-color:rgba(232,184,91,.42);
  box-shadow:0 0 0 1px rgba(232,184,91,.08);
}
.score-card .name{
  font-size:12px;color:var(--mut);
  margin-bottom:5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.score-card .pts-val{
  font-size:24px;font-weight:850;
  font-variant-numeric:tabular-nums;
  line-height:1.15;
}
.score-card .pts-val.neg{color:var(--red)}
.score-card.lead .pts-val{color:var(--gold)}
.score-card .meta{
  font-size:11px;color:var(--mut);margin-top:5px;
  display:flex;gap:6px;justify-content:center;flex-wrap:wrap;
}
.score-card .meta span{
  background:rgba(255,255,255,.06);
  padding:2px 7px;border-radius:999px;
}
.clue-progress{
  display:flex;gap:6px;margin:8px 0 4px;justify-content:center;
}
.clue-progress i{
  width:28px;height:4px;border-radius:4px;
  background:rgba(255,255,255,.1);
  transition:background .25s;
}
.clue-progress i.on{background:var(--gold)}
.clue-progress i.done{background:rgba(232,184,91,.45)}
button#claimBtn{
  font-size:17px;padding:17px;
  box-shadow:0 8px 24px rgba(232,184,91,.22);
  letter-spacing:.2px;
}
button#claimBtn:hover{box-shadow:0 10px 28px rgba(232,184,91,.3)}
.confirm-backdrop{
  animation:fadeIn .2s ease-out;
}
.confirm-box{
  animation:pop .28s ease-out;
  max-height:90vh;overflow:auto;
}
.confirm-box .answer-label{
  margin:0 0 6px;color:#4d5b5b;font-size:13px;font-weight:700;
  letter-spacing:.3px;text-transform:uppercase;
}
.modal-scores{
  display:flex;gap:8px;justify-content:center;flex-wrap:wrap;
  margin-top:16px;padding-top:14px;border-top:1px solid #e5e5e5;
}
.modal-scores span{
  background:#efece6;padding:5px 12px;border-radius:10px;
  font-size:13px;color:#17252b;
}
.locked{
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.skip-panel{
  animation:pop .2s ease-out;
}
.top{
  flex-wrap:wrap;
}
.timer{
  transition:color .2s,background .2s;
}
.who button{
  transition:background .15s,transform .12s;
}
.who button:active{transform:scale(.97)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@media(max-width:600px){
  body{padding:14px 12px max(18px,env(safe-area-inset-bottom))}
  #app{padding:22px 17px;border-radius:21px;min-height:0}
  .row{gap:7px}
  .row>button{padding-inline:14px}
  .cats{gap:8px}
  .cats button{padding:12px 9px;font-size:14px}
  .clue{font-size:17px;padding:15px 16px}
  .top{font-size:12px}
  .scoreboard{grid-template-columns:repeat(2,1fr)}
  .seg button{padding:10px 4px;font-size:13px}
  button#claimBtn{font-size:16px;padding:15px}
}
@media(max-width:380px){
  .who{grid-template-columns:1fr}
  .row{flex-wrap:wrap}
  .row>button{flex:1}
  .scoreboard{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ====== قاعدة البيانات: رياضة، شخصيات تاريخية، أنمي وألعاب ======
const PLAYERS = [
["رونالدينيو","football",["مرّ بمحطة أوروبية أولى في فرنسا قبل الانتقال إلى معقل كتالوني مصغر","عُرف بارتدائه أرقاماً شهيرة مثل 10 و80 في مسيرته الاحترافية","توج بجميع الألقاب الكبرى (مونديال، دوري أبطال، كرة ذهبية)","توج بالكرة الذهبية عام 2005 وأمتع الجماهير في الكلاسيكو بصفير الإعجاب","ساحر برازيلي بابتسامة عريضة اشتهر بلقب مستمد من ولاية ريو غراندي دو سول"]],
["زين الدين زيدان","football",["بدأ مسيرته الاحترافية في نادي مدينة بحريّة جنوبيّة قبل الانتقال لوسط فرنسا","انتقل بصفقة قياسية تاريخية عام 2001 لنادي العاصمة الملكي الإسباني","قاد منتخبه لنهائيين موندياليين بفارق 8 سنوات بينهما","درّب نادياً أوروبياً تاريخياً وحقق معه معجزة ثلاثية دوري الأبطال متتالية","الأسطورة الفرنسية صاحب رأسية نهائي مونديال 2006 الشهيرة"]],
["دييغو مارادونا","football",["حقق إنجازاً إعجازياً مع نادٍ متوسط في جنوب إيطاليا عجز الكبار عن فعله","قصير القامة، عُرف بقوة التحمل الفائقة وبداية مسيرته في نادي أرجنتينوس جونيورز","سجل أشهر هدفين متناقضين تماماً في مباراة واحدة بربع نهائي مونديال 1986","صاحب هدف اليد الشهير وأيقونة نابولي والأرجنتين الخالدة","الساحر الأرجنتيني الأبرز الذي ارتدى القميص رقم 10 بشموخ"]],

// حفظ حالة اللعبة في sessionStorage (كل الصفحات + مؤقتات بساعة حقيقية)
const GAME_KEY="minhuwa_game";
function saveGame(){
  try{
    const data={
      step:S.step,setupPage:S.setupPage,names:S.names,mode:S.mode,
      teamMapping:S.teamMapping,team1Name:S.team1Name,team2Name:S.team2Name,
      displayTeams:S.displayTeams,cats:S.cats,rounds:S.rounds,skipCount:S.skipCount,
      skips:S.skips,spare:S.spare,doubleCount:S.doubleCount,doubles:S.doubles,
      doubleBy:S.doubleBy,timer:S.timer,deck:S.deck,i:S.i,clue:S.clue,
      reveal:S.reveal,scores:S.scores,turn:S.turn,t:S.t,claimMode:S.claimMode,
      claimer:S.claimer,claimT:S.claimT,scored:S.scored,claimClue:S.claimClue,
      streaks:S.streaks,recorded:S.recorded,pickSkip:S.pickSkip,pickDouble:S.pickDouble,
      // مواعيد الساعة الحقيقية — تكمل بعد الـ refresh
      timerEnd:S.timerEnd||null,
      claimEnd:S.claimEnd||null,
      nextClueAt:S.nextClueAt||null
    };
    sessionStorage.setItem(GAME_KEY,JSON.stringify(data));
  }catch(e){}
}
function loadGame(){
  try{
    const raw=sessionStorage.getItem(GAME_KEY);
    if(!raw)return false;
    const data=JSON.parse(raw);
    if(!data||!data.step)return false;
    Object.assign(S,data);
    S.iv=null;S.hintIv=null;S.claimIv=null;
    // مزامنة الوقت المتبقي من الساعة الحقيقية
    syncTimersFromClock();
    return true;
  }catch(e){return false}
}
function clearGame(){
  try{sessionStorage.removeItem(GAME_KEY)}catch(e){}
}
function syncTimersFromClock(){
  const now=Date.now();
  if(S.timerEnd&&S.timer>0&&!S.reveal&&!S.claimMode){
    S.t=Math.max(0,Math.ceil((S.timerEnd-now)/1000));
  }
  if(S.claimEnd&&S.claimMode&&S.claimer!==null&&!S.reveal){
    S.claimT=Math.max(0,Math.ceil((S.claimEnd-now)/1000));
  }
  // تقدّم التلميحات حسب الوقت المنقضي
  if(S.nextClueAt&&S.step==="play"&&!S.reveal&&!S.claimMode&&S.clue<4){
    while(S.clue<4&&S.nextClueAt&&now>=S.nextClueAt){
      S.clue++;
      S.nextClueAt=S.clue<4?(S.nextClueAt+15000):null;
    }
  }
}

  get(k,d){try{const v=localStorage.getItem(k);if(v!==null)return JSON.parse(v)}catch(e){} return k in MEM?MEM[k]:d},
  set(k,v){MEM[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
// النقاط وسجل الفوز للجلسة فقط — تتصفر مع كل فتح للموقع
try{localStorage.removeItem("minhuwa_stats")}catch(e){}
const loadStats=()=>MEM.stats||{};
const saveStats=st=>{MEM.stats=st};
// ذاكرة الأسئلة تبقى في المتصفح حتى لا تتكرر الشخصيات
const loadSeen=()=>LS.get("minhuwa_seen",[]);
function markSeen(name){
  const a=loadSeen();
  if(!a.includes(name)){a.push(name);LS.set("minhuwa_seen",a)}
}
function recordResults(){
  if(S.recorded)return false;
  S.recorded=true;
  const st=loadStats();
  const top=Math.max(...S.scores);
  const add=(n,pts,won)=>{
    const r=st[n]||{wins:0,points:0,games:0};
    r.games++;r.points+=pts;if(won)r.wins++;
    st[n]=r;
  };
  if(S.mode==="teams"){
    [0,1].forEach(k=>{
      S.names.filter(n=>(S.teamMapping[n]||"1")===String(k+1))
        .forEach(n=>add(n,S.scores[k],top>0&&S.scores[k]===top));
    });
  }else{
    S.names.forEach((n,i)=>add(n,S.scores[i],top>0&&S.scores[i]===top));
  }
  saveStats(st);
  return true;
}
const fmtDbl=n=>String(n);

function setup(){
  if((S.setupPage||1)===1)setupPlayers();else setupOptions();
}

const stepsBar=p=>`<div class="steps"><span class="${p===1?"on":""}">١ · اللاعبين</span><span class="${p===2?"on":""}">٢ · الإعدادات</span></div>`;

// ====== الصفحة الأولى: النمط واللاعبين ======
function teamCounts(){
  const t1=S.names.filter(n=>(S.teamMapping[n]||"1")==="1").length;
  const t2=S.names.filter(n=>(S.teamMapping[n]||"1")==="2").length;
  return {t1,t2};
}
function teamsValid(){
  if(S.mode!=="teams")return true;
  if(S.names.length<3)return false;
  const {t1,t2}=teamCounts();
  return t1>=1&&t2>=1;
}
function canProceedSetup(){
  if(S.names.length<2)return false;
  if(S.mode==="teams")return teamsValid();
  return true;
}

function setupPlayers(){
  // الفرق تحتاج 3 لاعبين على الأقل — أقل من ذلك نرجع للفردي
  if(S.mode==="teams"&&S.names.length<3)S.mode="solo";

  const stats=loadStats();
  const chips=S.names.map((n,i)=>{
    const r=stats[n];
    const info=r&&r.games?`<small>🏆 ${r.wins} · ${r.points} نقطة</small>`:"";
    return `<div class="chip">${esc(n)}${info}<b data-del="${i}" aria-label="حذف">×</b></div>`;
  }).join("");

  const teamsUnlocked=S.names.length>=3;
  let teamsHTML="";
  if(S.mode==="teams"&&teamsUnlocked){
    const t1m=S.names.filter(n=>(S.teamMapping[n]||"1")==="1");
    const t2m=S.names.filter(n=>(S.teamMapping[n]||"1")==="2");
    const card=(team,members,name,arrow)=>{
      const list=members.length
        ?members.map(n=>`<div class="team-player" draggable="true" data-player="${esc(n)}">
            <span>${esc(n)}</span>
            <button type="button" class="move-btn" data-move="${esc(n)}" data-to="${team==="1"?"2":"1"}" title="نقل">${arrow}</button>
          </div>`).join("")
        :`<div class="team-empty">اسحب لاعباً واحداً على الأقل</div>`;
      return `<div class="team-col" data-team="${team}">
        <div class="team-title">
          <input id="t${team}name" value="${esc(name)}" placeholder="اسم الفريق">
          <span class="team-count">${members.length}</span>
        </div>
        <div class="team-drop" data-drop="${team}">${list}</div>
      </div>`;
    };
    const emptyWarn=!teamsValid()?`<p class="sub" style="margin-top:10px;color:var(--red)">كل فريق لازم فيه لاعب واحد على الأقل (مثلاً 1:1 أو 1:2)</p>`:"";
    teamsHTML=`<h2>توزيع الفرق</h2>
    <p class="sub" style="margin-top:-4px">اسحب اللاعب أو اضغط السهم — ما يصير فريق فاضي</p>
    <div class="team-boards">
      ${card("1",t1m,S.team1Name,"←")}
      ${card("2",t2m,S.team2Name,"→")}
    </div>
    ${emptyWarn}`;
  }

  const teamsBtnDisabled=!teamsUnlocked;
  const teamsHint=!teamsUnlocked?`<p class="sub" style="margin-top:8px;font-size:12px">وضع الفرق يفتح من 3 لاعبين فأكثر</p>`:"";

  $().innerHTML=`<h1>مين هو؟</h1>
  <p class="sub">تلميحات بدون أسماء؛ كل ما حزرت بتلميحات أقل، زادت نقاطك.</p>
  ${stepsBar(1)}

  <h2>نمط اللعب</h2>
  <div class="cats">
    <button data-mode="solo" class="${S.mode==="solo"?"on":""}">فردي</button>
    <button data-mode="teams" class="${S.mode==="teams"?"on":""}" ${teamsBtnDisabled?"disabled style='opacity:.45'":""} title="${teamsBtnDisabled?"أضف 3 لاعبين على الأقل":""}">فريقين</button>
  </div>
  ${teamsHint}

  <h2>اللاعبين</h2>
  <div class="row"><input id="nm" placeholder="اسم اللاعب" maxlength="14"><button id="add">أضف</button></div>
  <div class="chips">${chips||'<span class="sub">أضف لاعبين اثنين على الأقل</span>'}</div>
  ${teamsHTML}

  <button class="big" id="next" ${canProceedSetup()?"":"disabled style='opacity:.4'"}>التالي ←</button><div class="foot"></div>`;

  const nm=document.getElementById("nm");
  const add=()=>{
    const v=nm.value.trim();
    if(v&&S.names.length<12&&!S.names.includes(v)){
      // توزيع تلقائي بالتناوب بين الفريقين
      const t1c=S.names.filter(n=>(S.teamMapping[n]||"1")==="1").length;
      const t2c=S.names.filter(n=>(S.teamMapping[n]||"1")==="2").length;
      S.names.push(v);
      S.teamMapping[v]=t1c<=t2c?"1":"2";
      setup();document.getElementById("nm").focus();
    }
  };
  document.getElementById("add").onclick=add;
  nm.onkeydown=e=>{if(e.key==="Enter")add()};
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
    const n=S.names[+b.dataset.del];
    S.names.splice(+b.dataset.del,1);delete S.teamMapping[n];
    if(S.names.length<3)S.mode="solo";
    setup();
  });
  document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{
    if(b.disabled)return;
    const m=b.dataset.mode;
    if(m==="teams"&&S.names.length<3)return;
    S.mode=m;
    setup();
  });
  if(S.mode==="teams"){
    const t1=document.getElementById("t1name"),t2=document.getElementById("t2name");
    if(t1)t1.onchange=e=>{S.team1Name=e.target.value.trim()||"الفريق الأول";saveGame()};
    if(t2)t2.onchange=e=>{S.team2Name=e.target.value.trim()||"الفريق الثاني";saveGame()};
    // نقل بالزر (موبايل) — منع تفريغ فريق
    document.querySelectorAll("[data-move]").forEach(btn=>{
      btn.onclick=e=>{
        e.stopPropagation();
        const name=btn.dataset.move;
        const from=S.teamMapping[name]||"1";
        const to=btn.dataset.to;
        const fromCount=S.names.filter(n=>(S.teamMapping[n]||"1")===from).length;
        if(fromCount<=1)return; // ما نخلي فريق فاضي
        S.teamMapping[name]=to;
        setup();
      };
    });
    // سحب وإفلات — منع تفريغ فريق
    let dragName=null;
    document.querySelectorAll(".team-player").forEach(el=>{
      el.addEventListener("dragstart",e=>{
        dragName=el.dataset.player;
        el.classList.add("dragging");
        e.dataTransfer.effectAllowed="move";
        try{e.dataTransfer.setData("text/plain",dragName)}catch(err){}
      });
      el.addEventListener("dragend",()=>el.classList.remove("dragging"));
    });
    document.querySelectorAll(".team-col").forEach(col=>{
      col.addEventListener("dragover",e=>{
        e.preventDefault();
        col.classList.add("drag-over");
      });
      col.addEventListener("dragleave",()=>col.classList.remove("drag-over"));
      col.addEventListener("drop",e=>{
        e.preventDefault();
        col.classList.remove("drag-over");
        const name=dragName||(e.dataTransfer&&e.dataTransfer.getData("text/plain"));
        const team=col.dataset.team;
        if(name&&team&&S.names.includes(name)){
          const from=S.teamMapping[name]||"1";
          if(from!==team){
            const fromCount=S.names.filter(n=>(S.teamMapping[n]||"1")===from).length;
            if(fromCount<=1){dragName=null;return;} // ما نخلي فريق فاضي
          }
          S.teamMapping[name]=team;
          setup();
        }
        dragName=null;
      });
    });
  }
  document.getElementById("next").onclick=()=>{
    if(!canProceedSetup())return;
    S.setupPage=2;saveGame();setup();window.scrollTo(0,0);
  };
  saveGame();
}

// ====== الصفحة الثانية: القوائم والإعدادات ======
function setupOptions(){
  const poolAll=PLAYERS.filter(p=>S.cats.includes(p[1]));
  const seenSet=new Set(loadSeen());
  const seenN=poolAll.filter(p=>seenSet.has(p[0])).length;
  const count=k=>PLAYERS.filter(p=>p[1]===k).length;
  const seg=(key,opts,cur)=>`<div class="seg" data-seg="${key}">${opts.map(([v,l])=>`<button data-v="${v}" class="${String(cur)===String(v)?"on":""}">${l}</button>`).join("")}</div>`;

  $().innerHTML=`<h1>الإعدادات</h1>
  ${stepsBar(2)}

  <h2>القوائم</h2>
  <div class="cats">${Object.entries(CATS).map(([k,v])=>`<button data-cat="${k}" class="${S.cats.includes(k)?"on":""}" aria-pressed="${S.cats.includes(k)}">${v}<small>${count(k)} شخصية</small></button>`).join("")}</div>
  <div class="row" style="margin-top:8px"><button type="button" class="ghost" id="allCats">تحديد الكل</button><button type="button" class="ghost" id="noCats">إلغاء الكل</button></div>

  <h2>اللعب</h2>
  <div class="opt"><div class="lbl">عدد الأسئلة</div>${seg("rounds",[[5,"5"],[10,"10"],[15,"15"],[20,"20"]],S.rounds)}</div>
  <div class="opt"><div class="lbl">المؤقت <small>بالثواني</small></div>${seg("timer",[[0,"بدون"],[120,"120"],[150,"150"],[180,"180"],[210,"210"],[240,"240"]],S.timer)}</div>

  <h2>القدرات الخاصة</h2>
  <div class="opt"><div class="lbl">⏭ تخطي السؤال <small>لكل لاعب</small></div>${seg("skip",[[0,"بدون"],[1,"1"],[2,"2"],[3,"3"]],S.skipCount)}</div>
  <div class="opt"><div class="lbl">⚡ نقاط ×2 <small>لكل لاعب · في الجولة</small></div>
    <div class="row">
      <input id="dblInput" type="number" min="0" max="20" step="1" value="${S.doubleCount}" placeholder="0" style="flex:1">
      <button type="button" class="ghost" id="dblZero">بدون</button>
    </div>
    <p class="sub" style="margin-top:8px;font-size:12px">أدخل عدد مرات الاستخدام لكل لاعب. ×2 تعطي +20 عند الإجابة الصحيحة.</p>
  </div>

  <details class="more"><summary>ذاكرة الأسئلة</summary>
    <p class="sub">طلعت ${seenN} من ${poolAll.length} شخصية في القوائم المحددة، وما تتكرر لين تخلص كلها. النقاط تتصفر مع كل فتح جديد للموقع.</p>
    <div class="row"><button type="button" class="ghost" id="resetSeen">تصفير ذاكرة الأسئلة</button></div>
  </details>

  <div class="nav"><button class="ghost" id="back">→ رجوع</button><button class="go" id="go" ${S.cats.length?"":"disabled style='opacity:.4'"}>ابدأ اللعب</button></div><div class="foot"></div>`;

  document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{
    const key=b.dataset.cat;
    S.cats=S.cats.includes(key)?S.cats.filter(x=>x!==key):[...S.cats,key];
    setup();
  });
  document.getElementById("allCats").onclick=()=>{S.cats=Object.keys(CATS);setup()};
  document.getElementById("noCats").onclick=()=>{S.cats=[];setup()};
  document.querySelectorAll("[data-seg]").forEach(g=>{
    g.querySelectorAll("button").forEach(b=>b.onclick=()=>{
      const k=g.dataset.seg,v=b.dataset.v;
      if(k==="rounds")S.rounds=+v;

  if(dblIn){

      if(v>20)v=20;

  const dblZ=document.getElementById("dblZero");
  if(dblZ)dblZ.onclick=()=>{S.doubleCount=0;setup()};
  document.getElementById("resetSeen").onclick=()=>{

  };

  document.getElementById("back").onclick=()=>{S.setupPage=1;saveGame();setup();window.scrollTo(0,0)};
  document.getElementById("go").onclick=start;
  saveGame();
}

// شخصيات مختارة لافتتاح الجولة بأسئلة أصعب من المعتاد
const HARD_OPENERS = {
  football:["يوهان كرويف","ميشيل بلاتيني","أندريا بيرلو","فرانز بيكنباور","ديدييه دروغبا","كاكا","جيانلويجي بوفون","باولو مالديني","تشافي هيرنانديز","روبرتو كارلوس","كيفن دي بروين","فيرجيل فان دايك","سون هيونغ مين","روبرت ليفاندوفسكي","لوكا مودريتش","سعيد العويران","سامي الجابر","ياسر القحطاني"],
  history:["ملا صدرا","ابن طاووس","المحقق الحلي","الإدريسي","الخليل بن أحمد الفراهيدي","الشيخ الكليني","الشيخ مرتضى الأنصاري","ابن خلدون","كميل بن زياد","ميثم التمار","الشريف المرتضى","نصير الدين الطوسي","العلامة الحلي"],
  toons:["ميناتو ناميكازي","كيلوا زولديك","إل","إيتاتشي أوتشيها","لايت ياغامي","ساتورو غوجو","كاكاشي هاتاكي","ساسكي أوتشيها","كونان إيدوغاوا"],
  games:["سام فيشر","ألتائير","ماكس باين","غوردون فريمان","سامس آران","فوكس ماكلاود","فينيكس رايت","جلادوس","سوليد سنيك","كازويا ميشيما"]
}
const HARD_OPENERS_ALL = Object.values(HARD_OPENERS).flat();

function start(){
  if(S.names.length<2)return;
  if(S.mode==="teams"){
    if(S.names.length<3||!teamsValid()){
      alert("وضع الفرق يحتاج 3 لاعبين على الأقل، وكل فريق لازم فيه لاعب واحد على الأقل.");
      S.step="setup";S.setupPage=1;setup();
      return;
    }
    const team1Members = S.names.filter(n => (S.teamMapping[n] || "1") === "1");
    const team2Members = S.names.filter(n => (S.teamMapping[n] || "1") === "2");
    
    const str1 = team1Members.join(" + ");
    const str2 = team2Members.join(" + ");
    
    S.displayTeams = [
      `${S.team1Name} (${str1})`,
      `${S.team2Name} (${str2})`
    ];
    S.scores = [0, 0];
    S.streaks = [0, 0];
  } else {
    S.scores = S.names.map(()=>0);
    S.streaks = S.names.map(()=>0);
  }

  if(!S.cats.length){alert("اختر قائمة واحدة على الأقل قبل بدء اللعب.");return;}
  const uniq=new Set();
  let pool=PLAYERS.filter(p=>S.cats.includes(p[1]) && !uniq.has(p[0]) && uniq.add(p[0]));
  // أول ثلاثة أسئلة تُختار من الشخصيات الأصعب ضمن القوائم المحددة، ثم تُستكمل الجولة عشوائياً
  const hardNames = S.cats.flatMap(cat=>HARD_OPENERS[cat] || []);
  const seenNow=new Set(loadSeen());
  let fresh=pool.filter(p=>!seenNow.has(p[0]));
  if(fresh.length<S.rounds){
    const names=new Set(pool.map(p=>p[0]));
    LS.set("minhuwa_seen",loadSeen().filter(n=>!names.has(n)));
    fresh=pool.slice();
  }
  const opening = shuffle(fresh.filter(p=>hardNames.includes(p[0]))).slice(0,Math.min(3,S.rounds));
  const remaining = shuffle(fresh.filter(p=>!opening.includes(p))).slice(0,Math.max(0,S.rounds-opening.length));
  S.deck=opening.concat(remaining);
  const rest=pool.filter(p=>!S.deck.includes(p));
  const restFresh=rest.filter(p=>fresh.includes(p)), restOld=rest.filter(p=>!fresh.includes(p));
  S.spare=shuffle(restOld).concat(shuffle(restFresh));
  S.skips=S.scores.map(()=>S.skipCount);
  S.pickSkip=false;
  S.pickDouble=false;
  S.doubles=S.scores.map(()=>S.doubleCount);
  S.doubleBy=null;
  S.recorded=false;
  S.i=0;S.turn=0;
  S.step="play";
  saveGame();
  newQ();
}

function clearAllTimers(){
  clearInterval(S.iv); S.iv=null;
  clearInterval(S.hintIv); S.hintIv=null;
  clearInterval(S.claimIv); S.claimIv=null;
}

function resumePlayTimers(){
  clearAllTimers();
  if(S.step!=="play")return;
  syncTimersFromClock();
  if(S.claimMode&&S.claimer!==null&&!S.reveal){
    if(S.claimT<=0){
      S.scores[S.claimer]-=10;
      S.streaks[S.claimer]=0;
      S.scored=true;
      S.reveal=true;
      S.claimMode=false;
      S.claimEnd=null;
      saveGame();
      render();
      return;
    }
    S.claimIv=setInterval(()=>{
      S.claimT=S.claimEnd?Math.max(0,Math.ceil((S.claimEnd-Date.now())/1000)):S.claimT-1;
      const el=document.getElementById("claimTm");
      if(el)el.textContent=S.claimT;
      if(S.claimT<=0){
        clearInterval(S.claimIv);
        S.scores[S.claimer]-=10;
        S.streaks[S.claimer]=0;
        S.scored=true;
        S.reveal=true;
        S.claimMode=false;
        S.claimEnd=null;
        saveGame();
        render();
      }
    },250);
    return;
  }
  if(S.reveal||S.claimMode)return;
  if(S.timer>0&&S.t>0)S.iv=setInterval(tick,250);
  if(S.clue<4){
    S.hintIv=setInterval(()=>{
      if(S.reveal||S.claimMode||S.clue>=4){clearInterval(S.hintIv);return;}
      const now=Date.now();
      const cd=document.getElementById("hintCd");
      if(cd&&S.nextClueAt)cd.textContent=Math.max(0,Math.ceil((S.nextClueAt-now)/1000));
      if(S.nextClueAt&&now>=S.nextClueAt){
        S.clue++;
        S.nextClueAt=S.clue<4?(now+15000):null;
        saveGame();
        render();
      }
    },200);
  }
}

function newQ(keepDouble){
  S.clue=0;
  S.reveal=false;
  S.pickSkip=false;
  S.pickDouble=false;
  S.claimMode=false;
  S.claimer=null;
  S.claimT=10;
  S.scored=false;
  S.claimEnd=null;
  if(keepDouble!==true)S.doubleBy=null;
  markSeen(S.deck[S.i][0]);
  S.t=S.timer||0;
  S.timerEnd=S.timer>0?(Date.now()+S.timer*1000):null;
  S.nextClueAt=Date.now()+15000;
  clearAllTimers();
  saveGame();
  render();
  resumePlayTimers();
}

function tick(){
  if(S.timerEnd){
    S.t=Math.max(0,Math.ceil((S.timerEnd-Date.now())/1000));
  }else{
    S.t--;
  }
  const el=document.getElementById("tm");
  if(el){el.textContent=S.t;el.classList.toggle("low",S.t<=10)}
  if(S.t<=0){
    clearAllTimers();
    S.reveal=true;
    S.timerEnd=null;
    S.nextClueAt=null;
    saveGame();
    render();
  }
}

function startClaim(){
  if(S.claimMode||S.reveal)return;
  clearInterval(S.iv); S.iv=null;
  clearInterval(S.hintIv); S.hintIv=null;
  S.claimMode=true;
  S.claimer=null;
  S.nextClueAt=null; // يوقف تقدّم التلميحات أثناء الحجز
  saveGame();
  S.claimT=10;
  render();
}

function selectClaimer(k){
  if(S.claimer!==null)return;
  S.claimer=k;
  S.claimClue=S.clue;
  S.claimT=10;
  S.claimEnd=Date.now()+10000;
  clearInterval(S.claimIv);
  saveGame();
  render();
  resumePlayTimers();
}

function revealNow(){
  clearInterval(S.claimIv);
  S.reveal=true;
  S.claimMode=false;
  saveGame();
  render();
}

function resolveClaim(correct){
  if(S.claimer===null)return;
  clearInterval(S.claimIv);
  const k=S.claimer;
  const isDouble=S.doubleBy===k;
  if(correct){
    let pts=(S.claimClue===0)?15:10;
    if(isDouble) pts*=2; // ×2 → 30 أو 20
    S.scores[k]+=pts;
    S.streaks[k]=(S.streaks[k]||0)+1;
    if(S.streaks[k]>=3 && S.streaks[k]%3===0){
      S.scores[k]+=5;
    }
  }else{
    S.scores[k]-=10;
    S.streaks[k]=0;
  }
  S.claimer=null;
  S.scored=true;
  saveGame();
  render();
}

function render(){
  if(S.step==="setup")return setup();
  if(S.step==="end")return end();
  
  const p=S.deck[S.i];
  const catName=CATS[p[1]]||p[1];
  const shown=p[2].slice(0,S.clue+1).map((c,k)=>`<div class="clue"><small>تلميح ${k+1} · ${esc(catName)}</small>${esc(c)}</div>`).join("");
  const left=4-S.clue;
  
  let currentList = S.mode==="teams" ? S.displayTeams : S.names;

  // التخطي متاح من التلميح 3 فصاعداً (clue >= 2)
  const skipUnlocked=S.clue>=2;
  const anySkip=!S.claimMode && skipUnlocked && S.skipCount>0 && S.skips.some(n=>n>0);
  const anyDouble=!S.claimMode && S.doubleCount>0 && S.doubleBy===null && S.doubles.some(n=>n>0);
  let skipHTML="";
  if(S.pickSkip){
    skipHTML=`<div class="skip-panel"><p>مين يستخدم التخطي؟ (−5 نقاط) ويتبدل السؤال.</p>
      <div class="who">${currentList.map((n,k)=>`<button data-sk="${k}" ${S.skips[k]<=0?"disabled":""}>${esc(n)} (باقي ${S.skips[k]})</button>`).join("")}</div>
      <button class="ghost big" id="skCancel" style="margin-top:10px">إلغاء</button></div>`;
  }else if(S.pickDouble){
    skipHTML=`<div class="skip-panel"><p>مين يفعّل النقاط المضاعفة؟ تنفعه فقط إذا هو اللي حزرها.</p>
      <div class="who">${currentList.map((n,k)=>`<button data-db="${k}" ${S.doubles[k]<=0?"disabled":""}>${esc(n)} (باقي ${fmtDbl(S.doubles[k])})</button>`).join("")}</div>
      <button class="ghost big" id="dbCancel" style="margin-top:10px">إلغاء</button></div>`;
  }else if(anySkip||anyDouble){
    skipHTML=`<div class="act-row">${anySkip?`<button class="skip-btn" id="skipBtn">⏭ تخطي (−5)</button>`:""}${anyDouble?`<button class="dbl-btn" id="dblBtn">⚡ نقاط ×2</button>`:""}</div>`;
  }else if(!S.claimMode && !skipUnlocked && S.skipCount>0){
    skipHTML=`<p class="sub" style="text-align:center;margin-top:8px;font-size:12px">التخطي يُفتح من التلميح 3</p>`;
  }
  const dblNote=S.doubleBy!==null?`<div class="dbl-note">⚡ نقاط مضاعفة (×2) لـ <b>${esc(currentList[S.doubleBy])}</b></div>`:"";

  const scoreBoard=`<div class="scoreboard">
    ${currentList.map((n,k)=>{
      const lead=S.scores[k]===Math.max(...S.scores)&&S.scores[k]>0;
      const meta=[];
      if((S.streaks[k]||0)>=2)meta.push(`<span>🔥 ${S.streaks[k]}</span>`);
      if(S.skipCount>0)meta.push(`<span>⏭ ${S.skips[k]}</span>`);
      if(S.doubleCount>0)meta.push(`<span>⚡ ${fmtDbl(S.doubles[k])}</span>`);
      return `<div class="score-card${lead?" lead":""}">
        <div class="name">${esc(n)}</div>
        <div class="pts-val${S.scores[k]<0?" neg":""}">${S.scores[k]}</div>
        ${meta.length?`<div class="meta">${meta.join("")}</div>`:""}
      </div>`;
    }).join("")}
  </div>`;
  const clueBar=`<div class="clue-progress" aria-hidden="true">${[0,1,2,3,4].map(i=>`<i class="${i<S.clue?"done":i===S.clue?"on":""}"></i>`).join("")}</div>`;

  let body;
  let modal="";
  if(S.claimMode && !S.reveal){
    if(S.claimer===null){
      body=`${clueBar}${shown}
      <div class="skip-panel" style="border-color:var(--gold)">
        <p style="color:var(--gold);font-weight:700;margin:0 0 10px">✋ عندي الإجابة! — مين حجز الدور؟</p>
        <div class="who">${currentList.map((n,k)=>`<button data-claim="${k}">${esc(n)}${S.doubles[k]>0&&S.doubleBy===null?` · ⚡`:""}</button>`).join("")}</div>
        ${anyDouble||S.doubles.some(n=>n>0)?`<p class="sub" style="margin:8px 0 0;font-size:12px">اضغط مطولاً أو فعّل ×2 من الزر بالأسفل قبل الحجز</p>`:""}
        <button class="ghost big" id="claimCancel" style="margin-top:10px">إلغاء الحجز</button>
      </div>
      ${anyDouble?`<div class="act-row" style="margin-top:8px"><button class="dbl-btn" id="dblBtn">⚡ تفعيل ×2 أولاً</button></div>`:""}`;
    }else{
      body=`${clueBar}${shown}
      <div class="skip-panel" style="border-color:var(--gold)">
        <p style="color:var(--gold);font-weight:700;margin:0 0 6px">🎤 دور: <b>${esc(currentList[S.claimer])}</b>${S.doubleBy===S.claimer?" · ⚡×2":""}</p>
        <p style="margin:0 0 10px;color:var(--mut)">يقول الإجابة الآن · باقي <span id="claimTm" style="color:var(--gold);font-weight:850;font-size:22px">${S.claimT}</span> ثانية</p>
        <button class="big" id="revealNowBtn">اكشف الإجابة الآن</button>
      </div>`;
    }
  }else if(!S.reveal){
    body=`${clueBar}${dblNote}${shown}
    ${left>0?`<div class="locked">⏱ التلميح التالي خلال <b id="hintCd" style="color:var(--gold);font-variant-numeric:tabular-nums">${S.nextClueAt?Math.max(0,Math.ceil((S.nextClueAt-Date.now())/1000)):15}</b> ثانية · باقي ${left}</div>`:`<div class="locked">آخر تلميح</div>`}
    <button class="big" id="claimBtn" style="margin-top:14px">✋ عندي الإجابة!</button>
    <div class="row" style="margin-top:10px"><button class="ghost" id="rv">اكشف بدون حجز</button></div>
    ${skipHTML}`;
  }else{
    body=`${clueBar}${shown}<div class="locked">انتهى السؤال</div>`;
    const who=S.claimer!==null?currentList[S.claimer]:null;
    const basePts=(S.claimClue===0)?15:10;
    const okPts=S.doubleBy===S.claimer?basePts*2:basePts;
    const streakNote=(S.claimer!==null&&(S.streaks[S.claimer]||0)>=2)?`<p style="margin:8px 0 0;color:#8a5d10;font-size:13px">🔥 سلسلة ${(S.streaks[S.claimer]||0)+1} — لو صح +5 إضافية</p>`:"";
    modal=`<div class="confirm-backdrop" id="answerModal">
      <div class="confirm-box win-box" style="text-align:center">
        <p class="answer-label">الإجابة الصحيحة</p>
        <div class="win-name" style="font-size:28px;margin:0 0 16px">${esc(p[0])}</div>
        ${who?`
          <p style="margin:0 0 14px;color:#4d5b5b;line-height:1.6">هل إجابة <b>${esc(who)}</b> صحيحة؟</p>
          <div class="confirm-actions">
            <button id="claimOk" style="background:#9bc9a9;color:#17252b;flex:1">صح (+${okPts})</button>
            <button id="claimWrong" style="background:#d96c62;color:#fff;flex:1">خطأ (−10)</button>
          </div>
          ${streakNote}
        `:S.scored?`
          <p style="margin:0 0 14px;color:#2d6a4f;font-weight:700">✓ تم تسجيل النقاط</p>
          <button class="big" id="none" style="margin:0">التالي ←</button>
        `:`
          <p style="margin:0 0 14px;color:#4d5b5b">ما أحد حجز الإجابة</p>
          <button class="big" id="none" style="margin:0">التالي ←</button>
        `}
        <div class="modal-scores">
          ${currentList.map((n,k)=>`<span>${esc(n)}: <b>${S.scores[k]}</b></span>`).join("")}
        </div>
      </div>
    </div>`;
  }

  $().innerHTML=`<div class="top"><span>سؤال ${S.i+1} من ${S.deck.length} · ${esc(catName)}</span><div class="top-right">${S.timer>0&&!S.reveal&&!S.claimMode?`<span class="timer ${S.t<=10?"low":""}" id="tm">${S.t}</span>`:""}<button class="exit-btn" id="exitGame">انسحاب</button></div></div>
  ${scoreBoard}
  ${body}${modal}<div class="foot"></div>`;
  
  const q=id=>document.getElementById(id);
  if(q("exitGame"))q("exitGame").onclick=confirmExit;
  if(q("rv"))q("rv").onclick=()=>{clearAllTimers();S.claimer=null;S.reveal=true;render()};
  if(q("none"))q("none").onclick=next;
  if(q("claimBtn"))q("claimBtn").onclick=startClaim;
  if(q("revealNowBtn"))q("revealNowBtn").onclick=revealNow;
  if(q("claimCancel"))q("claimCancel").onclick=()=>{
    S.claimMode=false;S.claimer=null;S.claimEnd=null;
    if(S.clue<4)S.nextClueAt=Date.now()+15000;
    saveGame();
    render();
    resumePlayTimers();
  };
  if(q("claimOk"))q("claimOk").onclick=()=>resolveClaim(true);
  if(q("claimWrong"))q("claimWrong").onclick=()=>resolveClaim(false);
  document.querySelectorAll("[data-claim]").forEach(b=>b.onclick=()=>selectClaimer(+b.dataset.claim));
  if(q("skipBtn"))q("skipBtn").onclick=()=>{S.pickSkip=true;S.pickDouble=false;render()};
  if(q("dblBtn"))q("dblBtn").onclick=()=>{S.pickDouble=true;S.pickSkip=false;render()};
  if(q("dbCancel"))q("dbCancel").onclick=()=>{S.pickDouble=false;render()};
  document.querySelectorAll("[data-db]").forEach(b=>b.onclick=()=>useDouble(+b.dataset.db));
  if(q("skCancel"))q("skCancel").onclick=()=>{S.pickSkip=false;render()};
  document.querySelectorAll("[data-sk]").forEach(b=>b.onclick=()=>useSkip(+b.dataset.sk));
}

function useSkip(k){
  if(S.skips[k]<=0)return;
  S.skips[k]--;
  S.scores[k]-=5; // تكلفة التخطي
  S.streaks[k]=0;
  S.pickSkip=false;
  if(S.spare.length){
    S.deck[S.i]=S.spare.pop();
    newQ(true);
  }else{
    if(S.doubleBy!==null){
      S.doubles[S.doubleBy]++;
      S.doubleBy=null;
    }
    next();
  }
}

function useDouble(k){
  if(S.doubles[k]<=0||S.doubleBy!==null)return;
  S.doubles[k]--;
  S.doubleBy=k;
  S.pickDouble=false;
  render();
}

function confirmExit(){
  if(document.getElementById("exitConfirm"))return;
  clearAllTimers();
  const resumeTimer=()=>{
    if(S.timer>0&&!S.reveal&&!S.claimMode)S.iv=setInterval(tick,1000);
    if(!S.reveal&&!S.claimMode&&S.clue<4)S.hintIv=setInterval(()=>{
      if(S.reveal||S.claimMode||S.clue>=4){clearInterval(S.hintIv);return;}
      S.clue++;render();
    },15000);
  };
  const modal=document.createElement("div");
  modal.id="exitConfirm";
  modal.className="confirm-backdrop";
  modal.innerHTML=`<div class="confirm-box" role="dialog" aria-modal="true" aria-labelledby="exitTitle">
    <h2 id="exitTitle">تأكيد الانسحاب</h2>
    <p>هل أنت متأكد أنك تريد الانسحاب؟ ستنتهي الجولة الحالية وتُفقد نتيجتها.</p>
    <div class="confirm-actions"><button class="stay" id="cancelExit">متابعة اللعب</button><button id="confirmExitBtn" style="background:#8f342b;color:white">انسحاب</button></div>
  </div>`;
  document.body.appendChild(modal);
  document.getElementById("cancelExit").onclick=()=>{modal.remove();resumeTimer()};
  document.getElementById("confirmExitBtn").onclick=()=>{
    clearAllTimers(); modal.remove(); clearGame(); S.step="setup"; setup();
  };
  modal.onclick=e=>{if(e.target===modal){modal.remove();resumeTimer()}};
}

function next(){
  clearAllTimers();
  S.i++;
  if(S.i>=S.deck.length){
    S.step="end";
    saveGame();
    render();
  } else {
    newQ();
  }
}

function showWinner(order,top,st){
  const win=order.filter(o=>o.s===top);
  const noPts=top===0;
  const solo=S.mode!=="teams";
  const names=win.map(o=>esc(o.n)).join(" و ");
  let meta="";
  if(noPts) meta="ما أحد جاب نقاط هالجولة!";
  else if(win.length>1) meta=`تعادل بـ ${top} نقطة`;
  else{
    meta=`${top} نقطة`;
    if(solo&&st[win[0].n])meta+=`<br>هذا فوزه رقم ${st[win[0].n].wins} — مجموع نقاطه ${st[win[0].n].points}`;
  }
  const modal=document.createElement("div");
  modal.id="winModal";
  modal.className="confirm-backdrop";
  modal.innerHTML=`<div class="confirm-box win-box" role="dialog" aria-modal="true" aria-labelledby="winTitle">
    <div class="win-trophy">${noPts?"🤝":"🏆"}</div>
    <h2 id="winTitle">${noPts?"انتهت الجولة":win.length>1?"تعادل!":"مبروك الفوز!"}</h2>
    <div class="win-name">${noPts?"":names}</div>
    <p class="win-meta">${meta}</p>
    <div class="confirm-actions"><button id="winClose">عرض النتائج</button></div>
  </div>`;
  document.body.appendChild(modal);
  const close=()=>modal.remove();
  document.getElementById("winClose").onclick=close;
  modal.onclick=e=>{if(e.target===modal)close()};
}

function end(){
  let currentList = S.mode==="teams" ? S.displayTeams : S.names;
  const order=currentList.map((n,i)=>({n,s:S.scores[i]})).sort((a,b)=>b.s-a.s);
  const top=order[0].s;
  const winners=order.filter(o=>o.s===top).map(o=>o.n).join(" و ");
  const firstTime=recordResults();
  const st=loadStats();
  const solo=S.mode!=="teams";

  $().innerHTML=`<h1>النتيجة النهائية</h1><p class="sub">الفائز (${S.mode==="teams"?"الفريق":"اللاعب"}): ${esc(winners)}</p>
  ${order.map(o=>{
    const r=solo&&st[o.n];
    const info=r?`<small class="st">🏆 ${r.wins} فوز · ${r.points} نقطة إجمالاً · ${r.games} جولة</small>`:"";
    return `<div class="score ${o.s===top?"first":""}"><span>${esc(o.n)}${info}</span><span>${o.s} نقطة</span></div>`;
  }).join("")}
  <button class="big" id="again">جولة جديدة بنفس الإعدادات</button>
  <button class="big ghost" id="home">تغيير الإعدادات</button><div class="foot"></div>`;

  document.getElementById("again").onclick=start;
  document.getElementById("home").onclick=()=>{clearGame();S.step="setup";S.setupPage=2;render()};
  if(firstTime)showWinner(order,top,st);
}

if(loadGame()){
  // تصحيح حالة قديمة غير صالحة (فريق فاضي أو أقل من 3 لاعبين)
  if(S.mode==="teams"&&(S.names.length<3||!teamsValid())){
    if(S.step==="setup"){S.mode=S.names.length<3?"solo":S.mode;}
  }
  render();
  if(S.step==="play")resumePlayTimers();
}else{
  render();
}
</script>
</body>
</html>
